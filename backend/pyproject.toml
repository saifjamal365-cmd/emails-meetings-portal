# pyproject.toml - describes the backend: its name, Python version,
# the libraries it needs, and how the tools (ruff, pytest) are configured.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-meeting-portal"
version = "0.1.0"
description = "Multi-agent portal: email priority agent, meeting summary agent, and daily tasks (Arabic + English)."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",            # the HTTP API
    "uvicorn[standard]>=0.30",   # the web server that runs FastAPI
    "pydantic-settings>=2.4",    # load settings from .env into a typed object
    "sqlalchemy>=2.0",           # database tables (SQLite now, PostgreSQL later)
    "google-genai>=2.25",        # Google Gemini API (the LLM, free tier)
    "apscheduler>=3.10",         # background jobs: check emails, morning/evening plans
    "google-api-python-client>=2.100",  # Gmail API
    "google-auth>=2.30",                # Google credentials
    "google-auth-oauthlib>=1.2",        # "Connect Gmail" login flow (OAuth)
    "cryptography>=43",                 # encrypt saved OAuth tokens
    "itsdangerous>=2.2",                # sign the login cookie
    "faster-whisper>=1.2",              # speech-to-text on this computer (meeting recorder)
    "soundcard>=0.4.6",                 # record microphone + speakers (meeting recorder)
    "numpy>=2.0",                       # audio samples
    "sherpa-onnx>=1.13",                # separate the other people's voices (meeting recorder)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",     # formats and lints the code
    "pytest>=8.0",   # runs the tests
    "httpx>=0.27",   # used by the API tests to call endpoints
    "pip-audit>=2.7",  # checks the libraries for known security problems
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = security checks (the same rules as Bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]  # tests use assert and fake passwords on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test makes a real call to the Gemini API (deselect with '-m \"not integration\"')",
]
